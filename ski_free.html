<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ski Free</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #87CEEB; /* Sky blue background */
      font-family: Arial, sans-serif;
    }
    
    #game-container {
      position: relative;
      border: 2px solid #000;
      background-color: #87CEEB;
    }
    
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #000;
      font-size: 16px;
    }
    
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="500" height="500"></canvas>
    <div id="status">Score: 0</div>
  </div>

  <script src="ski_free_npc.js"></script>
  <script src="ski_free_game.js"></script>
</body>
</html>
