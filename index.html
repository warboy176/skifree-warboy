function checkAchievementOnScorableAction(actionType, scoreDelta) {
  if (!Array.isArray(game.achievements)) return;
  const achievement = game.achievements.find(a => a.type === actionType);
  if (!achievement || achievement.unlocked) return;
  achievement.counter += scoreDelta;

    showAchievementUnlock(achievement);

function checkAchievementsOnScorableAction(actionType, value = 0) {
  if (!Array.isArray(game.achievements)) return;
  for (const achievement of game.achievements) {
    if (achievement.unlocked || achievement.type !== actionType) continue;
    achievement.counter += value;
    if (achievement.counter >= achievement.unlockThreshold) {
      achievement.unlocked = true;
      showAchievementUnlock(achievement);
    }
  }
}

function checkAchievementConditions(id) {
  if (!Array.isArray(game.achievements)) return false;
  if (id === undefined) {
    let anyUnlocked = false;
    for (let i = 0; i < game.achievements.length; i++) {
      const achievement = game.achievements[i];
      if (achievement.counter >= achievement.unlockThreshold && !achievement.unlocked) {
        achievement.unlocked = true;
        anyUnlocked = true;
      }
    }
    return anyUnlocked;
  }
  const achievement = game.achievements.find(a => a.type === id);
  if (!achievement) return false;
  return achievement.counter >= achievement.unlockThreshold;
}

function triggerAchievement(name) {
  const achievement = game.achievements[name];
  if (achievement) {
    achievement.unlocked = true;
    achievement.counter++;
  }
}

function checkAchievements() {
  for (let i = 0; i < game.achievements.length; i++) {
    const achievement = game.achievements[i];
    if (!achievement.unlocked) {
      switch (achievement.type) {
        case 'score':
          if (GameState.score >= achievement.unlockThreshold) {
            achievement.unlocked = true;
            triggerAchievement(achievement);
          }
          break;
        case 'speed':
          if (PlayerState.speed >= achievement.unlockThreshold) {
            achievement.unlocked = true;
            triggerAchievement(achievement);
          }
          break;
        case 'distance':
          if (PlayerState.distance >= achievement.unlockThreshold) {
            achievement.unlocked = true;
            triggerAchievement(achievement);
          }
          break;
        case 'npcKills':
          if (game.npcSkiers.length >= achievement.unlockThreshold) {
            achievement.unlocked = true;
            triggerAchievement(achievement);
          }
          break;
        case 'maxSpeed':
          if (game.maxSpeed >= achievement.unlockThreshold) {
            achievement.unlocked = true;
          }
          break;
      }
    }
  }
}

function handleJumpingObstacleCollision(dt) {

function isPlayerInAir() {

function drawMutantSnowWolf(wolf) {

  const eyeXs = [x - 10, x + 10];

  // Original code-drawn body
  ctx.fillStyle = 'black';
  ctx.fillRect(x, y, 6, 6);

  // Glow effect, drawn behind the eyes: 2px-offset semi-transparent white circles
  ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
  for (const ex of eyeXs) {
    ctx.beginPath();
    ctx.arc(ex + 3 + 2, eyeY + 3 + 2, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Eyes: two 6x6 white squares with a 2px black border, drawn on top of the glow
  for (const ex of eyeXs) {
    ctx.fillStyle = 'black';
    ctx.fillRect(ex - 2, eyeY - 2, 10, 10);
    ctx.fillStyle = 'white';
    ctx.fillRect(ex, eyeY, 6, 6);
  }
}

function getTreeHeightRange(biomeStage) {
  switch (biomeStage) {
    case 'forest':
      return { min: 10, max: 30 };
    case 'snowpeak':
      return { min: 5, max: 15 };
    case 'frozenwaste':
      return { min: 1, max: 5 };
    default:
      return { min: 0, max: 0 };
  }
}

function scaleTreeWidthByHeight(treeHeight, baseWidthRatio = 0.05) { return treeHeight * baseWidthRatio; }

function getTreeHeightFromSeed(seed) {
  const hash = seed.toString().split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
  const pseudoRandomValue = (hash * 123456789) % 1000;
  return Math.floor(pseudoRandomValue / 10) + 10; // Ensures the value is in the range [10, 100]
}

function getTreeWidthFromSeed(seed) {
  return (seed % 10) + 5;
}

function initTreeWidthSeed(seed) {
  return Number.isInteger(seed) ? Math.max(1, seed % 10 + 1) : 1;
}

function seedToTreeColor(seed) {
  const hash = seed.toString().split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
  const hue = (hash % 360); // Map the hash to a hue value between 0 and 359
  const saturation = 70; // Fixed saturation
  const lightness = 50; // Fixed lightness
  return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
}

function seedBasedTreeColor(seed) {
  return 'green';
}

function drawTree(ctx, x, y) {
  const pixelSize = 2;
  const centerX = x + 2;
  const centerY = y + 2;

  // Define colors
  const green = '#0c6d57';
  const darkGreen = '#0a5a48';
  const brown = '#7a431f';

  // Draw the 5x5 grid of 2x2 pixel units
  // Center pixel (2,2) — green
  ctx.fillStyle = green;
  ctx.fillRect(centerX, centerY, pixelSize, pixelSize);

  // Dark green pixels: (1,1), (1,2), (1,3), (2,1), (2,3), (3,1), (3,2), (3,3)
  const darkGreenPixels = [
    {x: 1, y: 1}, {x: 1, y: 2}, {x: 1, y: 3},
    {x: 2, y: 1},           {x: 2, y: 3},
    {x: 3, y: 1}, {x: 3, y: 2}, {x: 3, y: 3}
  ];
  ctx.fillStyle = darkGreen;
  darkGreenPixels.forEach(p => {
    ctx.fillRect(centerX + (p.x - 2) * pixelSize, centerY + (p.y - 2) * pixelSize, pixelSize, pixelSize);
  });

  // Brown pixel at (2,0) — trunk
  ctx.fillStyle = brown;
  ctx.fillRect(centerX, centerY + (0 - 2) * pixelSize, pixelSize, pixelSize);
}

function drawTrees(dt) {
  for (let i = 0; i < game.trees.length; i++) {
    let tree = game.trees[i];
    if (tree.active && tree.x >= 0 && tree.x <= W && tree.y >= 0 && tree.y <= H) {
      ctx.fillStyle = 'black';
      ctx.strokeStyle = 'white';
      ctx.fillRect(tree.x, tree.y, 6, 12);
      ctx.strokeRect(tree.x, tree.y, 6, 12);
    }
  }
}

function renderVisibleTrees() {
  for (let i = 0; i < game.trees.length; i++) {

      drawTree(ctx, tree.x, tree.y);
    }
  }
}

function resetClosePassFlagOnRangeExit(npcSkier, player) {
  if (npcSkier.closePass) {
    const horizontalDistance = Math.abs(npcSkier.x - player.x);
    if (horizontalDistance > 30 || npcSkier.direction !== player.direction) {
      npcSkier.closePass = false;
    }
  }
}

function resetClosePassFlagOnPlayer() {
  if (!game.npcSkiers.some(npc => checkClosePassCollision(player, npc))) {
    player.closePass = false;
  }
}

function checkClosePasses(dt) {
  let foundClosePass = false;
  for (const skier of game.npcSkiers) {
    const dx = Math.abs(skier.x - player.x);
    if (dx < 30 && player.vx > 0) {
      foundClosePass = true;
    }
  }
  if (foundClosePass) {
    player.closePass = true;
    setTimeout(() => { player.closePass = false; }, 100);
  }
}

function resetClosePassFlagOnPlayerMove(player, npcSkiers) {
  for (let i = 0; i < npcSkiers.length; i++) {
    const npc = npcSkiers[i];
    const horizontalDistance = Math.abs(npc.x - player.x);
    const verticalDistance = Math.abs(npc.y - player.y);
    const distance = Math.sqrt(Math.pow(horizontalDistance, 2) + Math.pow(verticalDistance, 2));
    
    if (distance > 50) {
      player.closePass = false;
    }
  }
}

function drawStyleMultiplierHUD() {

function applyStyleScoreMultiplierToGameLoop() {

}

function renderStyleScoreHUD() {

function resetStyleScoreOnDeath() {

    game.styleScore = 0;
  }
}

function playCrashSound() {
  if (player.crashed && !player.crashedPrev && game.soundBuffer && ctx.audioContext) {
    const source = ctx.audioContext.createBufferSource();
    source.buffer = game.soundBuffer;
    source.connect(ctx.audioContext.destination);
    source.start(0);
  }
  player.crashedPrev = player.crashed;
}

function playCrashSoundIfTransitioning(player, game) {
  if (player.crashed && !player.crashedPrev) {
    const source = game.audioContext.createBufferSource();
    source.buffer = game.soundBuffer;
    source.connect(game.audioContext.destination);
    source.start();
    player.crashedPrev = true;
  }
}

function attachCrashSoundListener() {
  const originalUpdate = update;
  update = function() {
    const player = game.player;
    if (player && !player.crashedPrev) {
      let crashed = false;
      
      // Check tree collisions
      if (game.trees && game.trees.length > 0) {
        for (let i = 0; i < game.trees.length; i++) {
          const tree = game.trees[i];
          if (tree && boxForObstacle(tree).intersects(boxForPlayer(player))) {
            crashed = true;
            break;
          }
        }
      }

      // Check NPC skier collisions
      if (!crashed && game.npcSkiers && game.npcSkiers.length > 0) {
        for (let i = 0; i < game.npcSkiers.length; i++) {
          const npc = game.npcSkiers[i];
          if (npc && boxForObstacle(npc).intersects(boxForPlayer(player))) {
            crashed = true;
            break;
          }
        }
      }

      // Check snow wolf collisions
      if (!crashed && game.mutantSnowWolves && game.mutantSnowWolves.length > 0) {
        for (let i = 0; i < game.mutantSnowWolves.length; i++) {
          const wolf = game.mutantSnowWolves[i];
          if (wolf && boxForObstacle(wolf).intersects(boxForPlayer(player))) {
            crashed = true;
            break;
          }
        }
      }

      if (crashed) {
        player.crashedPrev = true;
        playCrashSoundIfTransitioning(player, game);
      }
    }
    
    return originalUpdate.apply(this, arguments);
  };
}

function incrementCrashedThroughObstacleAchievement() {
  if (player.vx > 0 && !player.crashedPrev) {
    const playerBox = boxForPlayer(player);
    const obstacles = [...game.obstacles, ...game.npcSkiers];
    
    for (const obstacle of obstacles) {
      const obstacleBox = boxForObstacle(obstacle);
      
      if (checkPlayerCollision(obstacleBox, playerBox)) {
        game.achievements.crashedThroughObstacle++;
        player.crashedPrev = true;
        break;
      }
    }
  }
}

function renderAchievements(ctx, game) {
  if (!game.achievements || !game.achievements.some(a => a.unlocked)) return;
  const iconSize = 4;
  const gridWidth = 16;
  const gridHeight = 16;
  const startX = W - gridWidth;
  const startY = 0;
  game.achievements.forEach((a, i) => {
    if (a.unlocked) {
      drawAchievementIcon(ctx, startX + (i % 4) * iconSize, startY + Math.floor(i / 4) * iconSize);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(a.counter || 0, startX + (i % 4) * iconSize + iconSize/2, startY + Math.floor(i / 4) * iconSize + iconSize + 10);
    }
  });
}
