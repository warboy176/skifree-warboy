<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#d8f3ff">
  <meta name="description" content="A fast, self-contained pixel-art downhill skiing game with Warboy on the chase.">
  <title>SkiFree '91 — Canvas Remake</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d8f3ff'/%3E%3Cpath d='M16 3l-7 10h5L7 23h18l-7-10h5z' fill='%230c6d57'/%3E%3Crect x='14' y='22' width='4' height='7' fill='%237a431f'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#102a43;--snow:#eefaff;--ice:#c5ecfa;--red:#e33232;--navy:#123c69;--gold:#ffd43b}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#b7e4f4}
    body{font-family:"Courier New",Courier,monospace;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    main{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,2vw,22px)}
    .cabinet{position:relative;width:min(1100px,100%);height:100%;max-height:900px;border:4px solid var(--ink);background:var(--snow);box-shadow:10px 10px 0 rgba(16,42,67,.22);overflow:hidden}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair;outline:none}
    .controls{position:absolute;right:14px;bottom:12px;display:flex;gap:6px;pointer-events:none;opacity:.86}
    .key{min-width:28px;height:28px;padding:0 7px;display:grid;place-items:center;background:rgba(238,250,255,.92);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:13px;font-weight:700}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:640px){main{padding:0}.cabinet{border-width:0;box-shadow:none;max-height:none}.controls{display:none}}
  </style>
</head>
<body>
<main>
  <section class="cabinet" aria-label="SkiFree game">
    <canvas id="game" tabindex="0" aria-label="SkiFree. Press Enter or tap to start. Use arrow keys or pointer to steer, Space to jump, arrow keys in the air to flip, and F for fast mode."></canvas>
    <div class="controls" aria-hidden="true"><span class="key">←</span><span class="key">↓</span><span class="key">→</span><span class="key">SPACE</span><span class="key">F</span></div>
    <p id="status" class="sr-only" aria-live="polite">Press Enter or click to ski.</p>
  </section>
</main>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Canvas & constants
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const statusEl = document.getElementById('status');
  const DPR_CAP = 2;
  const HUD_H = 54;
  const METERS_PER_PIXEL = 0.25;
  const MAX_SPEED = 420;
  const PlayerState = Object.freeze({IDLE:'IDLE',SKIING:'SKIING',JUMPING:'JUMPING',CRASHED:'CRASHED',EATEN:'EATEN'});
  const GameState = Object.freeze({START:'START',INTRO:'INTRO',PLAYING:'PLAYING',ENDING:'ENDING',GAMEOVER:'GAMEOVER',WON:'WON'});

// NPC Skier constants
const NPC_SKIER_SPEED = 200;
const NPC_SKIER_WIDTH = 20;
const NPC_SKIER_HEIGHT = 20;
const NPC_SKIER_COLOR = '#ffcc00';


initVersionConstant();



// NPC Skier class
class NPCSkier {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.speed = NPC_SKIER_SPEED;
  }

  update() {
    this.y += this.speed * game.deltaTime;
  }

  draw() {
    ctx.fillStyle = NPC_SKIER_COLOR;
    ctx.fillRect(this.x, this.y, NPC_SKIER_WIDTH, NPC_SKIER_HEIGHT);
  }
}

// Autoplayer logic
let autoplay = {
  enabled: new URLSearchParams(window.location.search).get('demo') === '1',
  simulateKeyPress: function(key) {
    const event = new KeyboardEvent('keydown', { code: key, key: key, repeat: false });
    document.dispatchEvent(event);
    setTimeout(() => {
      const upEvent = new KeyboardEvent('keyup', { code: key, key: key });
      document.dispatchEvent(upEvent);
    }, 100);
  },
  run: function() {
    if (!autoplay.enabled || game.state === GameState.GAMEOVER || game.state === GameState.WON) return;
    if (game.state === GameState.START) {
      autoplay.simulateKeyPress('Enter');
      return;
    }
    if (player.state === PlayerState.IDLE) {
      autoplay.simulateKeyPress('Enter');
      return;
    }
    if (player.state === PlayerState.SKIING) {
      const obstacles = game.obstacles.filter(obstacle => obstacle.y < player.y + 100);
      if (obstacles.length > 0) {
        const closestObstacle = obstacles.reduce((a, b) => a.y < b.y ? a : b);
        if (closestObstacle.type === 'drone') {
          autoplay.simulateKeyPress('Space');
        } else {
          if (closestObstacle.x < player.x) {
            autoplay.simulateKeyPress('ArrowLeft');
          } else {
            autoplay.simulateKeyPress('ArrowRight');
          }
        }
      }
    }
    requestAnimationFrame(autoplay.run);
  }
};

if (autoplay.enabled) {
  requestAnimationFrame(() => autoplay.run());
}
  let W = 960, H = 720, dpr = 1;

  // ---------------------------------------------------------------------------
  // Input Handling
  // ---------------------------------------------------------------------------
  const input = {left:false,right:false,down:false,pointer:false,pointerX:0};
  const pressed = new Set();
  let fastMode = false;

  function keyName(e){ return e.code || e.key; }
  addEventListener('keydown', e => {
    const k = keyName(e);
    if (['ArrowLeft','ArrowRight','ArrowDown','Space','Enter','KeyF','KeyR'].includes(k)) e.preventDefault();
    if (k === 'ArrowLeft') input.left = true;
    if (k === 'ArrowRight') input.right = true;
    if (k === 'ArrowDown') input.down = true;
    if (!e.repeat) pressed.add(k);
    if (k === 'KeyF' && !e.repeat && game.state === GameState.PLAYING) fastMode = !fastMode;
    if (k === 'Enter' && game.state === GameState.START) startGame();
    if (k === 'KeyR' && (game.state === GameState.GAMEOVER || game.state === GameState.WON)) startGame();
  });
  addEventListener('keyup', e => {
    const k = keyName(e);
    if (k === 'ArrowLeft') input.left = false;
    if (k === 'ArrowRight') input.right = false;
    if (k === 'ArrowDown') input.down = false;
  });
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    input.pointer = true;
    input.pointerX = (e.clientX - r.left) * W / r.width;
  });
  canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') input.pointer = false; });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.focus();
    const r = canvas.getBoundingClientRect();
    input.pointer = true;
    input.pointerX = (e.clientX - r.left) * W / r.width;
    if (game.state === GameState.START || game.state === GameState.GAMEOVER || game.state === GameState.WON) startGame();
    else if (game.state === GameState.PLAYING) pressed.add('Space');
  });

  // ---------------------------------------------------------------------------
  // Game model & finite state machine
  // ---------------------------------------------------------------------------
  const player = {
    x:0,y:0,vx:0,speed:150,state:PlayerState.IDLE,stateTime:0,jumpTime:0,
    jumpDuration:.82,jumpHeight:0,spin:0,flipDir:0,flipActive:false,flips:0,invulnerable:0,
    closePass:false,
    crashed: false,
    crashedPrev: false
  };
  const yeti = {
    active:false,x:0,y:0,vx:0,vy:0,phase:0,step:0,
    mode:'STALK',modeTime:0,targetX:0,targetY:0,misses:0,
    cycle:'WAIT',cycleTime:0,cycleLimit:0
  };
  const game = {
    state:GameState.START,distance:0,style:0,cameraY:-220,spawnY:300,
    obstacles:[],snow:[],tracks:[],trackTimer:0,shake:0,flash:0,trickText:'',trickTime:0,
    cleanTime:0,maxSpeed:0,scoreSaved:false,milestone:0,lastTime:0,
    audioContext: null,
    soundBuffer: null
  };
  const SCORE_KEY='skifree91_arcade_scores_v1';
  function loadScores(){try{return JSON.parse(localStorage.getItem(SCORE_KEY)||'[]').slice(0,8);}catch(e){return [];}}
  let highScores=loadScores();

  // Lightweight in-memory event log for player actions (run starts, crashes, etc).
  // Kept bounded so a long run can't leak memory; read via game.eventLog for debugging.
  function logPlayerEvent(eventType, context){
    if(!game.eventLog) game.eventLog=[];
    game.eventLog.push({eventType:String(eventType), context:context||{}, distance:game.distance, time:Date.now()});
    if(game.eventLog.length>50) game.eventLog.shift();
  }

  function saveRun(result){
    if(game.scoreSaved)return;
    game.scoreSaved=true;
    highScores.push({distance:game.distance,style:game.style,maxSpeed:Math.round(game.maxSpeed*.12),result});
    highScores.sort((a,b)=>b.distance-a.distance||b.style-a.style||b.maxSpeed-a.maxSpeed);
    highScores=highScores.slice(0,8);
    try{localStorage.setItem(SCORE_KEY,JSON.stringify(highScores));}catch(e){}
    logPlayerEvent('run_end',{result,distance:game.distance,style:game.style});
  }

  function setPlayerState(next){
    player.state = next;
    player.stateTime = 0;
    if (next === PlayerState.JUMPING){ player.jumpTime = 0; player.jumpDuration=.82; player.spin = 0; player.flipDir=0; player.flipActive=false; player.flips=0; if (typeof game.playJumpSound === 'function') game.playJumpSound(); }
    if (next === PlayerState.CRASHED){ player.speed *= .25; game.cleanTime=0; game.shake = .25; logPlayerEvent('crash',{distance:game.distance,speed:player.speed}); if (typeof game.playCrashSound === 'function') game.playCrashSound(); }
    if (next === PlayerState.EATEN){ player.speed = 0; player.vx = 0; game.state = GameState.ENDING; statusEl.textContent = 'Caught by Warboy!'; logPlayerEvent('caught',{distance:game.distance}); }
  }

  // Adds the 'closePass' flag to the player, initialized to false. Spec only
  // requires the flag to exist and start false; whether it gets set true is
  // decided elsewhere (e.g. checkStyleScoreOnPass), not here.
  function addClosePassFlagToPlayer(){
    player.closePass = false;
  }

  function startGame(){
    Object.assign(player,{x:0,y:0,vx:0,speed:155,state:PlayerState.SKIING,stateTime:0,jumpTime:0,jumpDuration:.82,jumpHeight:0,spin:0,flipDir:0,flipActive:false,flips:0,invulnerable:0});
    addClosePassFlagToPlayer();
    Object.assign(yeti,{active:false,x:0,y:0,vx:0,vy:0,phase:0,step:0,mode:'STALK',modeTime:0,targetX:0,targetY:0,misses:0,cycle:'WAIT',cycleTime:0,cycleLimit:0});
    Object.assign(game,{state:GameState.PLAYING,npcSkiers:[],distance:0,style:0,cameraY:-H*.32,spawnY:H*.85,obstacles:[],snow:[],tracks:[],trackTimer:0,shake:0,flash:0,trickText:'',trickTime:0,cleanTime:0,maxSpeed:155,scoreSaved:false,milestone:0,dogs:[],dogTimer:0,lastBiome:'slope',canopyPatches:[],nightTransitionTriggered:false,forestTransitionTriggered:false,inForestBiome:false});
    fastMode = false;
    input.pointer = false;
    for(let i=0;i<70;i++) game.snow.push({x:rand(-W,W),y:rand(-H,H*2),s:pick([1,1,2]),a:rand(.25,.8)});
    generateCourse();
spawnHighJumpRamps();

    initNPCs();
initMutantSnowWolves();

    initBiomeTintState();

    initTrees();
    statusEl.textContent = 'Skiing. Distance zero meters.';
    logPlayerEvent('game_start',{});
  }

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ---------------------------------------------------------------------------
  // Spawn Logic — objects are created beyond the lower viewport edge
  // ---------------------------------------------------------------------------
  function makeObstacle(type,x,y){
    const sizes = {evergreen:[34,58],bare:[42,54],rock:[30,20],slope:[54,28],jump:[50,26],drone:[38,22],barrel:[28,34],oil:[58,20],mini:[32,44],firebarrel:[32,44]};
    const s=sizes[type];
    return {type,x,y,baseY:y,w:s[0],h:s[1],phase:rand(0,Math.PI*2),dir:Math.random()<.5?-1:1,used:false,broken:false,breakTime:0,splatTime:0};
  }

  // Creates a single collidable tree ('evergreen' or 'bare') at world position (x,y) and
  // registers it in both game.trees and game.obstacles, so the existing update (updateObstacles),
  // render (drawObstacle) and collision (handleCollisions) pipelines pick it up the same way they
  // already do for every other obstacle type. The single entry point used by initTrees() (initial
  // seed) and generateCourse()/generateForestObstacles() (ongoing spawns) so there is one place
  // that knows how a tree is built.
  function addTree(x,y,type){
    const tree = makeObstacle(type,x,y);
    game.trees.push(tree);
    game.obstacles.push(tree);
    return tree;
  }

  function generateCourse(){
    const target = player.y + H*1.45;
    while(game.spawnY < target){
      game.spawnY += rand(Math.max(48,78-game.distance/1200),112);
      const density = clamp(2 + game.distance/7000, 2, 7);
      const count = Math.random() < .76 ? Math.ceil(rand(1,density)) : 0;
      for(let i=0;i<count;i++){
        const pool=['evergreen','evergreen','bare','rock','slope','jump','jump','drone'];
        if(game.distance>=10000)pool.push('barrel','barrel','oil');
        if(game.distance>=20000)pool.push('mini','mini','firebarrel','firebarrel');
        const type=pick(pool);
        const laneX = player.x + rand(-W*.78,W*.78);
        game.obstacles.push(makeObstacle(type,laneX,game.spawnY+rand(-30,30)));
      }
      generateForestObstacles(game.spawnY);
      generateForestCanopy(game.spawnY);
    }
  }

  // Extra collidable trees layered on top of the normal spawn pool while the forest biome visual
  // is active, so the dense drawForestBiome() backdrop is matched by dense skiable trees.
  function generateForestObstacles(y){
    if(!game.inForestBiome) return;
    const extra = Math.ceil(rand(1,3));
    for(let i=0;i<extra;i++){
      const type = Math.random()<.7?'evergreen':'bare';
      const laneX = player.x + rand(-W*.95,W*.95);
      game.obstacles.push(makeObstacle(type,laneX,y+rand(-40,40)));
    }
  }

  // Non-collidable dappled-shade patches cast over the trail while the forest biome visual is
  // active, spawned alongside generateForestObstacles() so the overhead shadow scrolls in with
  // the same stretch of dense trees. Purely decorative: never enters game.obstacles/handleCollisions.
  function generateForestCanopy(y){
    if(!game.inForestBiome) return;
    const count = Math.ceil(rand(1,3));
    for(let i=0;i<count;i++){
      const cx = player.x + rand(-W*.9,W*.9);
      game.canopyPatches.push({x:cx,y:y+rand(-40,40),w:rand(70,150),h:rand(32,56),a:rand(.1,.22)});
    }
  }

  // ---------------------------------------------------------------------------
  // Collision Detection — padded AABBs keep the retro play feel forgiving
  // ---------------------------------------------------------------------------
  function boxForPlayer(){ return {x:player.x-8,y:player.y-10,w:16,h:22}; }
  function boxForObstacle(o){
    const pad = o.type==='evergreen'||o.type==='bare'?10:o.type==='oil'?9:6;
    return {x:o.x-o.w/2+pad,y:o.y-o.h/2+pad,w:o.w-pad*2,h:o.h-pad*2};
  }
  function overlaps(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

  // Direct-overlap AABB test between the player and a single course obstacle (tree, rock,
  // drone, etc). Mirrors checkNPCCollision's shape so handleCollisions() can use either
  // interchangeably instead of inlining the box math per caller.
  function checkPlayerCollision(obstacle){
    return overlaps(boxForPlayer(),boxForObstacle(obstacle));
  }

  // Direct-overlap AABB test between the player and a single NPC skier. Pure function of
  // its two arguments (no reliance on the outer `player`/`game` closures) so it can be reused
  // by handleCollisions() and by any future margin/near-miss logic without duplicating the box math.
  function checkNPCCollision(player,npc){
    const pb={x:player.x-8,y:player.y-10,w:16,h:22};
    const nb={x:npc.x-10,y:npc.y-18,w:20,h:34};
    return overlaps(pb,nb);
  }

  // Pure predicate: true when the player grazes an NPC skier closely enough to count as a
  // "close pass" (padded box overlaps the NPC's box) without an actual hit (checkNPCCollision
  // stays false). Mirrors checkNPCCollision's signature/box math so callers can reuse it the
  // same way; the margin is local since no shared NEAR_MISS_MARGIN global exists.
  function checkClosePassCollision(player,npc){
    const margin=14;
    const pb={x:player.x-8-margin,y:player.y-10-margin,w:16+margin*2,h:22+margin*2};
    const nb={x:npc.x-10,y:npc.y-18,w:20,h:34};
    return overlaps(pb,nb) && !checkNPCCollision(player,npc);
  }

  // Keeps player.closePass true for exactly the frames the player is close-passing any
  // NPC skier (see addClosePassFlagToPlayer for the flag's init).
  function updatePlayerClosePassFlag(){
    player.closePass = Array.isArray(game.npcSkiers) && game.npcSkiers.some(npc=>checkClosePassCollision(player,npc));
  }

  function handleCollisions(){
    if(player.invulnerable>0 || player.state===PlayerState.CRASHED || player.state===PlayerState.EATEN) return;
    const pb=boxForPlayer();
    for(const o of game.obstacles){
      if(o.used || Math.abs(o.y-player.y)>65 || !checkPlayerCollision(o)) continue;
      if(o.type==='jump'){
        o.used=true;
        if(player.state!==PlayerState.JUMPING){ setPlayerState(PlayerState.JUMPING); player.jumpDuration=1.08; game.style+=100; game.trickText='RAMP +100'; game.trickTime=.8; checkAchievement('jumps',1); }
        continue;
      }
      if(o.type==='slope'){
        o.used=true; o.broken=true; o.breakTime=.001; game.style+=25; game.trickText='BANNER BREAK +25'; game.trickTime=.8; continue;
      }
      if(o.type==='oil'){
        o.used=true;player.speed=Math.max(75,player.speed*.48);player.vx*=.55;game.cleanTime=0;game.trickText='OIL SLICK!';game.trickTime=1;game.oilHits=(game.oilHits||0)+1;updateAchievementsOnHazardEncounter('oil');continue;
      }
      if((o.type==='drone'||o.type==='mini') && player.state!==PlayerState.JUMPING){
        o.used=true; o.splatTime=.001; setPlayerState(PlayerState.CRASHED); player.invulnerable=1.1; checkAchievement('dronesCrashed',1); updateAchievementsOnHazardEncounter(o.type); break;
      }
      if(player.state===PlayerState.JUMPING && (o.type==='rock'||o.type==='drone'||o.type==='mini')){
        game.style+=o.type==='mini'?100:o.type==='drone'?40:10;o.used=true;if(o.type==='drone')checkAchievement('drones',1);if(o.type==='rock')game.rocksCleared=(game.rocksCleared||0)+1;continue;
      }
      setPlayerState(PlayerState.CRASHED);
      player.invulnerable=1.1;
      updateAchievementsOnHazardEncounter(o.type);
      break;
    }
    if(Array.isArray(game.npcSkiers)){
      for(const s of game.npcSkiers){
        if(Math.abs(s.y-player.y)>65) continue;
        if(checkNPCCollision(player,s)){ s.fallen=1.0; setPlayerState(PlayerState.CRASHED); player.invulnerable=1.1; updateAchievementsOnHazardEncounter('npcSkier'); break; }
      }
    }
    if(Array.isArray(game.dogs)){
      for(const d of game.dogs){
        if(d.hit>0 || Math.abs(d.y-player.y)>72) continue;
        if(overlaps(pb,{x:d.x-12,y:d.y-8,w:26,h:18})){ d.hit=1.0; updateAchievementsOnHazardEncounter('dog'); if(player.invulnerable<=0){ player.speed=Math.max(60,player.speed*0.55); game.shake=Math.max(game.shake,0.18); game.flash=Math.max(game.flash,0.12); } break; }
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Simulation update
  // ---------------------------------------------------------------------------
  function updatePlayer(dt){
    player.stateTime += dt;
    player.invulnerable = Math.max(0,player.invulnerable-dt);
    if(player.state===PlayerState.EATEN) return;

    if(player.state===PlayerState.CRASHED){
      player.speed=Math.max(0,player.speed-120*dt);
      if(player.stateTime>.72){ player.speed=105; setPlayerState(PlayerState.SKIING); }
    } else {
      game.cleanTime+=dt;
      const cruise=Math.min(MAX_SPEED,170+game.distance/180+Math.min(80,game.cleanTime*1.3));
      const targetSpeed = input.down ? Math.min(MAX_SPEED,cruise+65) : cruise;
      player.speed += (targetSpeed-player.speed)*Math.min(1,dt*(input.down?2.8:1.15));
      let steer=0;
      if(input.pointer){
        const screenX = W/2 + (player.x - player.x);
        steer=clamp((input.pointerX-screenX)/150,-1,1);
      } else steer=(input.right?1:0)-(input.left?1:0);
      player.vx += (steer*150-player.vx)*Math.min(1,dt*7);
      if(input.down && !steer) player.vx*=Math.pow(.08,dt);

      if(pressed.has('Space') && player.state===PlayerState.SKIING) setPlayerState(PlayerState.JUMPING);
      if(player.state===PlayerState.JUMPING){
        player.jumpTime+=dt;
        const p=clamp(player.jumpTime/player.jumpDuration,0,1);
        player.jumpHeight=Math.sin(p*Math.PI)*34;
        if(!player.flipActive && (pressed.has('ArrowLeft')||pressed.has('ArrowRight'))){
          player.flipDir=pressed.has('ArrowRight')?1:-1; player.flipActive=true;
          game.trickText=player.flipDir>0?'RIGHT FLIP!':'LEFT FLIP!'; game.trickTime=.65;
        }
        if(player.flipActive){
          player.spin+=player.flipDir*14.2*dt;
          if(Math.abs(player.spin)>=(player.flips+1)*Math.PI*2){
            player.flips++; player.flipActive=false; game.style+=250;
            game.trickText=`${player.flips>1?player.flips+'X ':''}FLIP +250`; game.trickTime=1;
          }
        }
        if(p>=1){
          const unfinished=player.flipActive && Math.abs(player.spin-player.flips*Math.PI*2)>.75;
          player.jumpHeight=0;
          if(unfinished){setPlayerState(PlayerState.CRASHED);player.invulnerable=1.1;game.trickText='BAD LANDING';game.trickTime=.8;}
          else setPlayerState(PlayerState.SKIING);
        }
      }
    }
    player.x += player.vx*dt;
    player.y += player.speed*dt;
    if(player.state===PlayerState.SKIING && player.speed>35){
      game.trackTimer+=dt;
      if(game.trackTimer>.055){
        const spread=7+Math.abs(player.vx)*.012;
        game.tracks.push({x1:player.x-spread,y:player.y+15,x2:player.x+spread});
        game.trackTimer=0;
      }
    }
  }

  function updateVerticalDistance(dt){
    game.distance=Math.max(game.distance,Math.floor(player.y*METERS_PER_PIXEL));
    game.maxSpeed=Math.max(game.maxSpeed,player.speed);
    if(game.distance>=30000){
      game.distance=30000;game.state=GameState.WON;player.speed=0;yeti.active=false;saveRun('WIN');
      statusEl.textContent='You won SkiFree! Thirty thousand meters complete.';
    }
  }

  function beginWarboyChase(){
    Object.assign(yeti,{
      active:true,x:player.x+pick([-1,1])*rand(210,350),y:player.y-rand(360,520),
      vx:0,vy:Math.max(180,player.speed*.8),phase:0,step:0,mode:'STALK',modeTime:0,misses:0,
      cycle:'CHASE',cycleTime:0,cycleLimit:rand(10,15)
    });
    game.flash=.55;statusEl.textContent='Warboy is chasing you.';
  }

  function updateYeti(dt){
    if(yeti.cycle==='WAIT'){
      if(game.distance>=2000)beginWarboyChase();
      else return;
    }
    if(yeti.cycle==='REST'){
      yeti.cycleTime+=dt;
      if(yeti.cycleTime>=yeti.cycleLimit)beginWarboyChase();
      return;
    }
    if(yeti.cycle==='TIRED'){
      yeti.cycleTime+=dt;yeti.phase+=dt;yeti.step+=dt*3;
      yeti.x+=yeti.vx*dt;yeti.y+=yeti.vy*dt;yeti.vx*=Math.pow(.08,dt);yeti.vy-=90*dt;
      if(yeti.cycleTime>=1.35){
        yeti.active=false;yeti.cycle='REST';yeti.cycleTime=0;yeti.cycleLimit=rand(20,40);
        game.trickText='WARBOY ESCAPED!';game.trickTime=1.5;statusEl.textContent='Warboy gave up. Ski free while he rests.';
      }
      return;
    }
    if(!yeti.active || player.state===PlayerState.EATEN) return;
    yeti.cycleTime+=dt;
    if(yeti.cycleTime>=yeti.cycleLimit){
      yeti.cycle='TIRED';yeti.cycleTime=0;yeti.mode='TIRED';yeti.modeTime=0;
      yeti.vx*=.18;yeti.vy*=.18;game.style+=500;game.trickText='ESCAPE +500';game.trickTime=1.2;return;
    }
    yeti.phase+=dt; yeti.step+=dt*(yeti.mode==='LUNGE'?13:9); yeti.modeTime+=dt;
    const chaseSpeed=Math.max(235,Math.min(MAX_SPEED*1.25,player.speed*1.25+18));

    if(yeti.mode==='STALK'){
      // The monster predicts your line, but cannot pivot instantly.
      const aimX=player.x+player.vx*.42;
      const aimY=player.y+20;
      const dx=aimX-yeti.x,dy=aimY-yeti.y,d=Math.hypot(dx,dy)||1;
      const turn=Math.min(1,dt*3.2);
      yeti.vx+=(dx/d*chaseSpeed-yeti.vx)*turn;
      yeti.vy+=(dy/d*chaseSpeed-yeti.vy)*turn;
      yeti.x+=yeti.vx*dt; yeti.y+=yeti.vy*dt;

      if(d<195 && yeti.y<player.y+35){
        // A committed lunge can be juked. Each miss makes the next attempt sharper.
        const error=Math.max(24,92-yeti.misses*16);
        yeti.targetX=player.x+player.vx*.55+rand(-error,error);
        yeti.targetY=player.y+95;
        const lx=yeti.targetX-yeti.x,ly=yeti.targetY-yeti.y,ld=Math.hypot(lx,ly)||1;
        yeti.vx=lx/ld*chaseSpeed*1.42;
        yeti.vy=ly/ld*chaseSpeed*1.42;
        yeti.mode='LUNGE';yeti.modeTime=0;game.flash=.16;
      }
    } else if(yeti.mode==='LUNGE'){
      yeti.x+=yeti.vx*dt; yeti.y+=yeti.vy*dt;
      const d=Math.hypot(player.x-yeti.x,player.y-yeti.y);
      if(d<23){setPlayerState(PlayerState.EATEN);return;}
      const passed=yeti.y>player.y+115;
      const reached=Math.hypot(yeti.targetX-yeti.x,yeti.targetY-yeti.y)<24;
      if(passed||reached||yeti.modeTime>.82){
        yeti.mode='RECOVER';yeti.modeTime=0;yeti.misses++;
        yeti.vx*=.48;yeti.vy*=.48;
      }
    } else {
      // Recovery gives the skier a real escape window after a successful dodge.
      yeti.x+=yeti.vx*dt;yeti.y+=yeti.vy*dt;
      yeti.vx*=Math.pow(.12,dt);yeti.vy*=Math.pow(.12,dt);
      if(yeti.modeTime>.72){yeti.mode='STALK';yeti.modeTime=0;}
    }
  }

  function updateObstacles(dt){
    for(const o of game.obstacles){
      if(o.type==='drone'||o.type==='mini'){
        if(o.splatTime>0)o.splatTime+=dt;
        else{
          o.phase+=dt*(o.type==='drone'?5.5:3.2);o.x+=o.dir*(o.type==='drone'?46:58)*dt;
          if(Math.sin(o.phase)>.985)o.dir*=-1;
        }
      }
      if(o.type==='firebarrel')o.phase+=dt*8;
      if(o.broken)o.breakTime+=dt;
    }
    // Strict cleanup: objects above the camera are removed from the active array.
    const cutoff=game.cameraY-130;
    game.obstacles=game.obstacles.filter(o=>o.y>cutoff);
    game.tracks=game.tracks.filter(t=>t.y>cutoff);
    if(Array.isArray(game.canopyPatches))game.canopyPatches=game.canopyPatches.filter(c=>c.y>cutoff);
  }

  // ---------------------------------------------------------------------------
  // Pixel art rendering
  // ---------------------------------------------------------------------------
  function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
  function poly(points,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(Math.round(points[0][0]),Math.round(points[0][1])); for(let i=1;i<points.length;i++)ctx.lineTo(Math.round(points[i][0]),Math.round(points[i][1])); ctx.closePath();ctx.fill(); }
  function limb(x1,y1,x2,y2,width,color){
    // Integer-stepped strokes avoid the soft antialiasing of rotated rectangles.
    const dx=x2-x1,dy=y2-y1,steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      rect(Math.round(x1+dx*t-width/2),Math.round(y1+dy*t-width/2),width,width,color);
    }
  }

  // --- NPC skiers (other skiers on the slope) --------------------------------------------------
  // Original art: simple geometric skier built from rect() primitives. Each is a self-contained
  // object with the update()/draw() methods the main loop already calls on game.npcSkiers.
  const NPC_SPAWN_MIN_INTERVAL = 1.5;
  const NPC_SPAWN_MAX_INTERVAL = 3;
  const NPC_SPAWN_SPACING = 140;
  const NPC_SPAWN_MAX_SKIERS = 12;
  function makeNpcSkier(){
    return {
      x: player.x + rand(-W*0.32, W*0.32),
      y: player.y + rand(-H*0.3, H*1.2),
      sp: rand(0.35, 1.05),
      phase: rand(0, Math.PI*2),
      fallen: 0,
      tone: pick(['#c94f4f','#4f7bc9','#5aa15a','#c9a24f','#8a5ac9','#c96fae']),
      hat: pick(['#2b2b33','#5a3a22','#204020','#3a2b4a']),
      update(){
        this.phase += 0.16;
        if (this.fallen > 0){ this.fallen -= 0.018; this.y += this.sp*0.15; }  // down ~1s, barely drifts
        else { this.y += this.sp; }
        if (this.y < player.y - H*0.85 || this.y > player.y + H*2.4){
          this.x = player.x + rand(-W*0.32, W*0.32);
          this.y = player.y + rand(H*0.9, H*1.6);
          this.sp = rand(0.35, 1.05); this.phase = rand(0, Math.PI*2); this.fallen = 0;
        }
      },
      draw(){
        const q = worldToScreen(this.x, this.y);
        if (q.y < -90 || q.y > H+130) return;
        ctx.save();
        ctx.translate(q.x, q.y);
        ctx.scale(1.5, 1.5);                              // player-sized presence
        if (this.fallen > 0){
          ctx.rotate(1.35);                               // toppled over on the slope
          rect(-16,-2,13,3,'#2b2b33'); rect(3,-3,13,3,'#2b2b33');    // skis flung sideways
          rect(-4,7,4,12,'#274a7d'); rect(2,8,4,11,'#3a6bb0');       // legs splayed
          rect(-7,-6,14,14,this.tone);                    // torso down
          rect(-14,3,2,15,'#6f4a2c');                     // pole flung out
          rect(-5,-16,10,10,'#f0cfa6');                   // head to the side
          rect(-6,-19,12,4,this.hat);                     // hat
        } else {
          const sway=Math.sin(this.phase)*2.5;
          const kick=(Math.sin(this.phase*2)>0)?2:-2;
          rect(-14,18,12,3,'#2b2b33'); rect(2,18,12,3,'#2b2b33');            // skis
          rect(-6,6,4,13+kick,'#274a7d'); rect(2,6,4,13-kick,'#3a6bb0');     // legs (animated)
          rect(-14+sway,-1,2,18,'#6f4a2c'); rect(12+sway,-1,2,18,'#6f4a2c'); // poles (sway)
          rect(-7,-7,14,15,this.tone);                    // torso jacket
          rect(-5,-5,10,8,'#eef0f4');                     // chest highlight
          rect(-10,-6,4,10,'#c98a4f'); rect(6,-6,4,10,'#c98a4f');            // arms
          rect(-5,-17,10,10,'#f0cfa6');                   // head
          rect(-6,-20,12,4,this.hat);                     // hat
        }
        ctx.restore();
      }
    };
  }
  // Subtle ring that flashes around an NPC skier when the player is within `threshold`
  // world units of it, giving a visual cue to accompany checkNPCProximity()'s near-miss bonus.
  function drawNearEffect(ctx, npc, threshold = 30) {
    const dx = player.x - npc.x;
    const dy = player.y - npc.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > threshold) return;
    const q = worldToScreen(npc.x, npc.y);
    if (q.y < -90 || q.y > H+130) return;
    ctx.save();
    ctx.globalAlpha = (1 - dist/threshold) * 0.6;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(q.x, q.y-10, 22, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  function initNPCs(){
    game.npcSkiers = [];
    for (let i=0; i<6; i++) game.npcSkiers.push(makeNpcSkier());
    game.npcSpawnTimer = rand(NPC_SPAWN_MIN_INTERVAL, NPC_SPAWN_MAX_INTERVAL);
    game.npcLastSpawnY = player.y + H*1.6;
  }

  // Periodically adds another NPC skier ahead of the player, on top of the fixed pool that
  // initNPCs() recycles forever, until NPC_SPAWN_MAX_SKIERS is reached. The timer re-rolls a
  // random NPC_SPAWN_MIN/MAX_INTERVAL gap after each spawn; each new skier is placed a fixed
  // NPC_SPAWN_SPACING below the previously spawned one so extra skiers don't clump together.
  function checkAndSpawnNPCs(dt){
    if(game.state!==GameState.PLAYING || !Array.isArray(game.npcSkiers)) return;
    game.npcSpawnTimer=(game.npcSpawnTimer==null?rand(NPC_SPAWN_MIN_INTERVAL,NPC_SPAWN_MAX_INTERVAL):game.npcSpawnTimer)-dt;
    if(game.npcSpawnTimer>0) return;
    game.npcSpawnTimer = rand(NPC_SPAWN_MIN_INTERVAL, NPC_SPAWN_MAX_INTERVAL);
    if(game.npcSkiers.length >= NPC_SPAWN_MAX_SKIERS) return;
    const npc = makeNpcSkier();
    npc.x = player.x + rand(-W*0.32, W*0.32);
    npc.y = (game.npcLastSpawnY || player.y) + NPC_SPAWN_SPACING;
    game.npcLastSpawnY = npc.y;
    game.npcSkiers.push(npc);
  }

  function makeDog(){
    return {
      x: player.x + rand(-W*0.4, W*0.4),
      y: player.y + rand(H*0.5, H*1.2),
      sp: rand(1.7, 2.5),
      t: rand(0, Math.PI*2),
      hit: 0,
      update(){
        this.t += 0.22;
        const dx = player.x - this.x;
        this.x += Math.max(-2.8, Math.min(2.8, dx*0.05));          // chase: steer toward the player's x
        const dy = (player.y + H*0.12) - this.y;                   // pursue up-slope toward the player
        this.y += Math.max(-1.6, Math.min(2.4, dy*0.035)) + (this.hit>0 ? 2.6 : 0);
        if (this.hit>0) this.hit -= 0.02;
        if (Math.abs(this.y-player.y) > H*2 || Math.abs(this.x-player.x) > W*1.3){
          this.x = player.x + rand(-W*0.4, W*0.4);
          this.y = player.y + rand(H*0.6, H*1.2);
          this.sp = rand(1.7, 2.5); this.hit = 0;
        }
      },
      draw(){
        const q = worldToScreen(this.x, this.y);
        if (q.y < -80 || q.y > H+120) return;
        ctx.save(); ctx.translate(q.x, q.y); ctx.scale(1.4, 1.4);
        const g = Math.sin(this.t)*2;                              // trotting gait
        rect(-12,-3,21,8,'#6b4a2f');                               // body
        rect(-14,-2,4,4,'#5a3d26');                                // haunch
        rect(-11,5,3,6+g,'#4a3320'); rect(-4,5,3,6-g,'#4a3320');   // back legs
        rect(4,5,3,6-g,'#4a3320'); rect(8,5,3,6+g,'#4a3320');      // front legs
        rect(8,-7,9,9,'#6b4a2f');                                  // head
        rect(16,-5,4,5,'#5a3d26');                                 // snout
        rect(8,-11,4,4,'#3a2817');                                 // ear
        rect(14,-4,2,2,'#120c06');                                 // eye
        rect(-16,-6,5,3,'#5a3d26');                                // tail
        if (this.hit>0){ rect(-3,-16,6,5,'#ffd24a'); }             // alert flash on contact
        ctx.restore();
      }
    };
  }

  function worldToScreen(x,y){ return {x:W/2+(x-player.x),y:HUD_H+y-game.cameraY}; }

  // Vertical alpine-sky gradient: deep blue up high fading through pale haze into the
  // biome-tinted horizon color, instead of a flat fill.
  function drawAlpineSkyGradient(skyColor){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#8ec9f0');
    grad.addColorStop(.45,'#cfeeff');
    grad.addColorStop(1,skyColor);
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);
  }

  function drawSnow(){
    const biomeVisual=game.biomeVisual||{sky:'#eefaff',dash:'rgba(129,203,229,.25)'};
    drawAlpineSkyGradient(biomeVisual.sky);
    ctx.globalAlpha=.62;
    for(const f of game.snow){
      const sx=((f.x-player.x*.08+W*2)%(W*1.5))-W*.25;
      const sy=HUD_H+(((f.y-game.cameraY*.18+H*3)%(H*1.4))-H*.2);
      rect(sx,sy,f.s*2,f.s,'#b8e5f4');
    }
    ctx.globalAlpha=1;
    for(let i=-2;i<4;i++){
      const y=HUD_H+((i*170-game.cameraY*.3)%(H+200));
      ctx.strokeStyle=biomeVisual.dash;ctx.lineWidth=2;ctx.setLineDash([12,20]);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+32);ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // Wraps drawSnow() with a cool night wash over just the snow/sky layer once game.biome
  // reaches 'night', so the falling snow reads as moonlit instead of staying daytime-bright
  // underneath the later full-scene drawNightBiomeOverlay darkening.
  function drawSnowWithNightTint(ctx){
    drawSnow();
    if(game.biome==='night'){
      ctx.save();
      ctx.fillStyle='rgba(8,12,34,.18)';
      ctx.fillRect(0,HUD_H,W,H-HUD_H);
      ctx.restore();
    }
  }

  function _bgHash(a,b){var v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v);}
  // WORLD-ANCHORED background trees: fixed world positions on a grid, drawn via worldToScreen so they
  // scroll past (up as you descend, sideways as you steer) and recycle only when off-screen. The old
  // version used screen-space modulo-wrapped low parallax -> the trees looked pinned/"followed you".
  function drawBackgroundTrees(){
    ctx.globalAlpha=.5;
    const SP=150;                                              // world grid spacing (world units == px)
    const cLo=Math.floor((player.x-W*0.7)/SP),cHi=Math.ceil((player.x+W*0.7)/SP);
    const rLo=Math.floor((game.cameraY-80)/SP),rHi=Math.ceil((game.cameraY+(H-HUD_H)+90)/SP);
    for(let c=cLo;c<=cHi;c++)for(let r=rLo;r<=rHi;r++){
      const h=_bgHash(c,r);
      if(h>0.4)continue;                                       // ~40% of grid cells carry a bg tree
      const wx=c*SP+(_bgHash(c+7,r)*70-35), wy=r*SP+(_bgHash(c,r+7)*70-35);
      const p=worldToScreen(wx,wy);
      if(p.x<-40||p.x>W+40||p.y<HUD_H-40||p.y>H+80)continue;
      drawEvergreen(p.x,p.y,.40+(Math.floor(h*7.5)%3)*.08);
    }
    ctx.globalAlpha=1;
  }

  // --- Forest biome decorative trees ------------------------------------------------------------
  // Denser than the ambient parallax layer (drawBackgroundTrees) above and only shown while the
  // biome visuals report 'forest' (game.distance 10000-20000), giving that stretch a distinct look.
  const forestBiomeConfig = {
    treeDensity: 11,
    treeMinHeight: 46,
    treeMaxHeight: 82,
    treeMinWidth: 22,
    treeMaxWidth: 38,
    treeColor: '#0a8a68',
    swayTime: 0
  };
  function drawForestTree(x,y,width,height,color,sway=0){
    const trunkW=Math.max(4,width*.18),trunkH=height*.32;
    rect(x-trunkW/2,y,trunkW,trunkH,'#5b321d');
    ctx.save();ctx.translate(x,y);ctx.rotate(sway);
    poly([[0,-height],[-width/2,0],[width/2,0]],color);
    poly([[0,-height*.62],[-width*.34,-height*.12],[width*.34,-height*.12]],color);
    ctx.restore();
  }
  // dt drives a slow wind-sway phase so the forest stretch doesn't feel static like the other biomes.
  function drawForestBiome(dt){
    if(!game.inForestBiome)return;
    forestBiomeConfig.swayTime+=dt||0;
    const {treeMinHeight,treeMaxHeight,treeMinWidth,treeMaxWidth,treeColor,swayTime}=forestBiomeConfig;
    ctx.globalAlpha=.55;
    const SP=95;                                              // denser than the ambient layer, still world-anchored
    const cLo=Math.floor((player.x-W*0.75)/SP),cHi=Math.ceil((player.x+W*0.75)/SP);
    const rLo=Math.floor((game.cameraY-100)/SP),rHi=Math.ceil((game.cameraY+(H-HUD_H)+110)/SP);
    for(let c=cLo;c<=cHi;c++)for(let r=rLo;r<=rHi;r++){
      const h=_bgHash(c*1.3,r*1.7);
      if(h>0.5)continue;                                       // ~50% -> a dense forest backdrop
      const wx=c*SP+(_bgHash(c+3,r)*60-30), wy=r*SP+(_bgHash(c,r+3)*60-30);
      const p=worldToScreen(wx,wy);
      if(p.x<-40||p.x>W+40||p.y<HUD_H-90||p.y>H+100)continue;
      const t=_bgHash(c+11,r+11);
      const width=treeMinWidth+t*(treeMaxWidth-treeMinWidth);
      const height=treeMinHeight+t*(treeMaxHeight-treeMinHeight);
      const sway=Math.sin(swayTime*1.3+c*7+r*3)*.035;
      drawForestTree(p.x,p.y,width,height,treeColor,sway);
    }
    ctx.globalAlpha=1;
  }

  // Overhead dappled-shade blobs for the forest stretch, sourced from game.canopyPatches
  // (seeded by generateForestCanopy() alongside the trees in generateForestObstacles).
  // Drawn after drawForestBiome's trees so the shadow reads as light filtering through the canopy.
  function drawForestCanopy(){
    if(!game.inForestBiome)return;
    if(!Array.isArray(game.canopyPatches))return;
    ctx.save();

  // --- Open snowfield ambient decoration ---------------------------------------------------------
  // Sparse, non-collidable snow bumps/drifts for the default 'slope' biome stretch, world-anchored
  // the same way as drawBackgroundTrees/drawForestBiome so they scroll with the world instead of
  // looking screen-pinned. Purely decorative: these never enter game.obstacles / handleCollisions.
  function drawSnowfieldObstacles(){
    if(game.biomeVisual&&game.biomeVisual.name!=='slope')return;
    ctx.globalAlpha=.5;
    const SP=130;
    const cLo=Math.floor((player.x-W*0.75)/SP),cHi=Math.ceil((player.x+W*0.75)/SP);
    const rLo=Math.floor((game.cameraY-90)/SP),rHi=Math.ceil((game.cameraY+(H-HUD_H)+100)/SP);
    for(let c=cLo;c<=cHi;c++)for(let r=rLo;r<=rHi;r++){
      const h=_bgHash(c*2.1,r*1.9);
      if(h>0.3)continue;                                       // ~30% of grid cells carry a snow bump
      const wx=c*SP+(_bgHash(c+5,r)*60-30), wy=r*SP+(_bgHash(c,r+5)*60-30);
      const p=worldToScreen(wx,wy);
      if(p.x<-40||p.x>W+40||p.y<HUD_H-30||p.y>H+60)continue;
      const t=_bgHash(c+13,r+13);
      const w=24+t*20,hgt=7+t*5;
      poly([[p.x-w/2,p.y+hgt/2],[p.x-w/4,p.y-hgt/2],[p.x+w/4,p.y-hgt/2],[p.x+w/2,p.y+hgt/2]],'#e3f4fb');
      rect(p.x-w/2,p.y+hgt/2-1,w,2,'#c5ecfa');
    }
    ctx.globalAlpha=1;
  }

  }

  function drawSkier(){
    const p=worldToScreen(player.x,player.y-player.jumpHeight);
    ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));
    if(player.state===PlayerState.EATEN){ctx.restore();return;}
    if(player.state===PlayerState.CRASHED){drawCrashPose(Math.min(3,(player.stateTime*6)|0));ctx.restore();return;}
    const steer=clamp(player.vx/150,-1,1),amount=Math.abs(steer),anim=((player.y/20)|0)&1;
    if(player.state===PlayerState.JUMPING){ctx.rotate(player.spin);drawSkierPose('JUMP',anim,steer<0);
renderSkin(game.skin, p.x, p.y);
}
    else if(input.down)drawSkierPose('TUCK',anim,steer<0);
    else if(amount>.72)drawSkierPose('SIDE',anim,steer<0);
    else if(amount>.24)drawSkierPose('DIAG',anim,steer<0);
    else drawSkierPose('SOUTH',anim,false);
    ctx.restore();
    if(player.state===PlayerState.JUMPING){
      const ground=worldToScreen(player.x,player.y);ctx.globalAlpha=.16;rect(ground.x-18,ground.y-4,36,8,'#102a43');ctx.globalAlpha=1;

  }

// Detects when the gameplay biome tier (game.biome, updated each tick by updateBiome()) has
// changed since the last check and fires a one-time flash/shake pulse so the player feels the
// exact instant of crossing a threshold, complementing the fade-in banner from drawBiomeTransition.
// currentDistance is accepted for callers that track distance explicitly, but the transition
// itself is driven off game.biome so it fires in sync with whichever update*(..) call last set it.
function checkBiomeTransition(currentDistance) {
    if (game.state !== GameState.PLAYING) return;
    if (game.biome !== game.lastBiome) {
        game.flash = Math.max(game.flash, 0.25);
        game.shake = Math.max(game.shake, 0.15);
        game.lastBiome = game.biome;
        if (game.biome === 'night') triggerNightTransition();
    }
}

// One-time dramatic beat for the moment the gameplay biome flips to 'night' (crossing the
// 25000m threshold in BIOME_THRESHOLDS): a stronger flash/shake than the generic biome-change
// pulse above, plus a NIGHTFALL banner and sound cue, so the darkest stretch of the run announces
// itself distinctly instead of blending in with the canyon/warzone transitions.
function triggerNightTransition() {
    if (game.nightTransitionTriggered) return;
    game.nightTransitionTriggered = true;
    game.flash = Math.max(game.flash, 0.5);
    game.shake = Math.max(game.shake, 0.3);
    game.trickText = 'NIGHTFALL';
    game.trickTime = 2;
    if (typeof game.triggerSoundEffect === 'function') game.triggerSoundEffect('nightfall');
}

// Detects the one-time moment game.biomeVisual (set by updateBiomeFromDistance, just above its
// caller) flips to 'forest' at the 10000m visual threshold from defineBiomeThresholds. Distinct
// from checkBiomeTransition, which only reacts to game.biome's gameplay tiers (slope/canyon/
// warzone/night) and never fires for 'forest' since that name isn't in BIOME_THRESHOLDS.
function checkForestBiomeTransition() {
    if (game.state !== GameState.PLAYING) return;
    if (!game.forestTransitionTriggered && game.biomeVisual && game.biomeVisual.name === 'forest') {
        game.forestTransitionTriggered = true;
        game.flash = Math.max(game.flash, 0.3);
        game.trickText = 'ENTERING THE FOREST';
        game.trickTime = 2;
        if (typeof game.triggerSoundEffect === 'function') game.triggerSoundEffect('forest');
    }
}

function updateBiomeFromDistance() {
    let current = game.biomeThresholds[0];
    for (const threshold of game.biomeThresholds) {
        if (game.distance >= threshold.min) current = threshold;
    }
    game.biome = current.name;
    game.biomeVisual = current;
    game.inForestBiome = current.name === 'forest';
}

// Initializes the forest-biome detection state read continuously by generateForestObstacles/
// generateForestCanopy/drawForestBiome/drawForestCanopy (game.inForestBiome, kept in sync every
// frame by updateBiomeFromDistance above) and the one-time "just arrived" banner fired by
// checkForestBiomeTransition (game.forestTransitionTriggered). Called once from initBiomeState()
// at script load; startGame()'s Object.assign resets both fields again for each run.
function initForestBiomeDetection() {

}

// Gameplay biome tiers (distinct from the visual biomeThresholds/biomeVisual used for sky and
// forest dressing above): drives the BIOME_TINTS overlay and the danger-zone milestone banners
// based on how far downhill the player has traveled.
const BIOME_THRESHOLDS = [
    {name:'slope', minDistance:0},
    {name:'canyon', minDistance:10000},
    {name:'warzone', minDistance:20000},
    {name:'night', minDistance:25000}
];

function updateBiome(playerY) {
    const distance = playerY * METERS_PER_PIXEL;
    let current = BIOME_THRESHOLDS[0];
    for (const tier of BIOME_THRESHOLDS) {
        if (distance >= tier.minDistance) current = tier;
    }
    game.biome = current.name;
}

const BIOME_TINTS = { canyon: { color: '#8e4f27', alpha: .08 }, warzone: { color: '#e33232', alpha: .12 } };

// Per-biome tint overlay now CROSSFADES instead of snapping, so crossing a BIOME_THRESHOLDS
// boundary eases the color/alpha wash in over BIOME_TINT_DURATION seconds rather than popping in
// on the frame the tier flips. initBiomeTintState() seeds the blend state (called once at script
// load from initBiomeState(), and again per run from startGame() so a restart doesn't inherit the
// previous run's tint); it must NOT read BIOME_TINTS since it can run before that const below is
// initialized. updateBiomeTintState() does the per-frame lerp and is only ever called after full
// script init, so referencing BIOME_TINTS there is safe.
function initBiomeTintState() {
    game.biomeTint = { r: 255, g: 255, b: 255, alpha: 0, fromR: 255, fromG: 255, fromB: 255, fromAlpha: 0, toR: 255, toG: 255, toB: 255, toAlpha: 0, progress: 1, targetBiome: null };
}

function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

const BIOME_TINT_DURATION = 1.2;
function updateBiomeTintState(dt) {
    const state = game.biomeTint;
    if (!state) return;
    if (state.targetBiome !== game.biome) {
        const tint = BIOME_TINTS[game.biome];
        const rgb = tint ? hexToRgb(tint.color) : { r: 255, g: 255, b: 255 };
        state.fromR = state.r; state.fromG = state.g; state.fromB = state.b; state.fromAlpha = state.alpha;
        state.toR = rgb.r; state.toG = rgb.g; state.toB = rgb.b; state.toAlpha = tint ? tint.alpha : 0;
        state.progress = 0;
        state.targetBiome = game.biome;
    }
    state.progress = Math.min(1, state.progress + (dt || 0) / BIOME_TINT_DURATION);
    const t = state.progress;
    state.r = state.fromR + (state.toR - state.fromR) * t;
    state.g = state.fromG + (state.toG - state.fromG) * t;
    state.b = state.fromB + (state.toB - state.fromB) * t;
    state.alpha = state.fromAlpha + (state.toAlpha - state.fromAlpha) * t;
}

function drawBiomeOverlay(ctx) {
    if (game.state !== GameState.PLAYING && game.state !== GameState.ENDING) return;
    const state = game.biomeTint;
    if (!state || state.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = state.alpha;
    ctx.fillStyle = `rgb(${state.r | 0},${state.g | 0},${state.b | 0})`;
    ctx.fillRect(0, HUD_H, W, H - HUD_H);
    ctx.restore();
}

// Per-biome background layer stack consumed by drawBiomeLayers(): which optional overlays sit on
// top of the base slope backdrop for each gameplay biome tier. Built from strings (not BIOME_TINTS
// itself) so initBiomeLayers() can run during early game-state setup without touching BIOME_TINTS/
// BIOME_THRESHOLDS before those consts below have initialized.

}

// Draws the current biome's layer stack (set up by initBiomeLayers()) on top of the slope
// background and behind the player/obstacles, reusing the existing tint/starfield overlays so each
// layer replaces only the background without touching other game elements.
function drawBiomeLayers(ctx) {
    const layers = (game.biomeLayers && game.biomeLayers[game.biome]) || [];
    for (const layer of layers) {
        if (layer === 'tint') drawBiomeOverlay(ctx);
        else if (layer === 'stars') drawNightBiomeOverlay(ctx, 0, HUD_H, W, H - HUD_H);
    }
}

// Speckle pattern for the night biome overlay: relative (0-1) offsets into the target rect plus a
// radius, so drawNightBiomeOverlay can scatter a consistent starfield across any x/y/w/h it's given.
const NIGHT_BIOME_PATTERNS = [
    { dx: 0.08, dy: 0.15, r: 1.2 }, { dx: 0.22, dy: 0.62, r: 0.8 }, { dx: 0.35, dy: 0.3, r: 1.5 },
    { dx: 0.47, dy: 0.78, r: 1 }, { dx: 0.58, dy: 0.12, r: 0.9 }, { dx: 0.7, dy: 0.5, r: 1.3 },
    { dx: 0.82, dy: 0.85, r: 0.7 }, { dx: 0.91, dy: 0.28, r: 1.1 }, { dx: 0.15, dy: 0.92, r: 0.9 },
    { dx: 0.63, dy: 0.95, r: 1 }, { dx: 0.3, dy: 0.08, r: 0.7 }, { dx: 0.78, dy: 0.08, r: 1 }
];

// Darkens the given rect to suggest nightfall and scatters NIGHT_BIOME_PATTERNS across it as
// faint stars; used for the 'night' gameplay biome where the flat BIOME_TINTS tint alone
// wouldn't read as night.
function drawNightBiomeOverlay(ctx, x, y, w, h) {
    ctx.save();
    ctx.fillStyle = 'rgba(8,12,34,.38)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const p of NIGHT_BIOME_PATTERNS) {
        ctx.beginPath();
        ctx.arc(x + p.dx * w, y + p.dy * h, p.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// Foundation data for the biome transition system: the world-distance (in meters) at which
// each biome boundary sits, paired with the banner label shown as the player nears it.
const biomeTransitionPoints = [ { distance: 10000, label: 'ENTERING CANYON' }, { distance: 20000, label: 'ENTERING WARZONE' }, { distance: 25000, label: 'NIGHTFALL' } ];

// Recomputed every update tick from the player's current distance so drawBiomeTransition can
// stay a pure render of already-known state instead of redoing this math every frame.
function updateBiomeTransition(distanceMeters) {
    game.biomeTransitions = [];
    for (const zone of biomeTransitionPoints) {
        const boundaryY = zone.distance / METERS_PER_PIXEL;
        const dy = boundaryY - player.y;
        if (dy < 0 || dy > 900) continue;
        game.biomeTransitions.push({ label: zone.label, boundaryY, alpha: 1 - dy / 900 });
    }
}

function drawBiomeTransition(ctx) {
    if (game.state !== GameState.PLAYING && game.state !== GameState.ENDING) return;
    if (!game.biomeTransitions) return;
    for (const zone of game.biomeTransitions) {
        const screenY = HUD_H + zone.boundaryY - game.cameraY;
        ctx.save();
        ctx.globalAlpha = zone.alpha * 0.85;
        ctx.strokeStyle = '#eefaff';
        ctx.lineWidth = 3;
        ctx.setLineDash([14, 10]);
        ctx.beginPath();
        ctx.moveTo(0, screenY);
        ctx.lineTo(W, screenY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#eefaff';
        ctx.font = '700 16px "Courier New",monospace';
        ctx.fillText(zone.label, W / 2, screenY - 8);
        ctx.restore();
    }
}

// Near-miss detector: fires when the player's padded box grazes an NPC skier's box
// (overlaps()) without an actual hit (checkNPCCollision() stays false), rewarding a small
// style bonus once per pass. `grazed` is tracked per-NPC so the bonus can't repeat every
// frame while skiing alongside the same skier, and resets once they drift apart again.
function checkNPCProximity(dt) {
  if (!Array.isArray(game.npcSkiers)) return;
  if (player.state === PlayerState.CRASHED || player.state === PlayerState.EATEN) return;
  const NEAR_MISS_MARGIN = 14;
  for (let i = 0; i < game.npcSkiers.length; i++) {
    const npc = game.npcSkiers[i];
    if (Math.abs(npc.y - player.y) > 60) { npc.grazed = false; continue; }
    const pb = {x:player.x-8-NEAR_MISS_MARGIN, y:player.y-10-NEAR_MISS_MARGIN, w:16+NEAR_MISS_MARGIN*2, h:22+NEAR_MISS_MARGIN*2};
    const nb = {x:npc.x-10, y:npc.y-18, w:20, h:34};
    if (overlaps(pb, nb) && !checkNPCCollision(player, npc)) {
      if (!npc.grazed) {
        npc.grazed = true;
        game.style += 5;
        game.trickText = 'NEAR MISS +5';
        game.trickTime = .6;
        trackAchievement('nearMiss', 1);
      }
    } else {
      npc.grazed = false;
    }
  }
}

// Washes the sky with a dusk color as the player nears the NIGHTFALL boundary (tracked in
// game.biomeTransitions by updateBiomeTransition), smoothing the handoff between the daytime
// drawAlpineSkyGradient and the hard darkening drawNightBiomeOverlay applies once game.biome

function drawSkyTint(ctx) {

}

// Faint stepped-pyramid mountain silhouettes far behind the slope. Built purely from
// fillRect calls (no strokes/paths) so each peak is just a stack of shrinking bars sharing
// one base line at canvas.height - 100.
function drawDistantMountainSilhouettes() {
  const baseY = canvas.height - 100;
  const peaks = [
    { x: canvas.width * 0.12, w: 220, h: 150, color: '#b7cfe0' },
    { x: canvas.width * 0.5, w: 260, h: 190, color: '#a3bfd4' },
    { x: canvas.width * 0.82, w: 200, h: 130, color: '#b7cfe0' }
  ];
  const steps = 8;
  for (const peak of peaks) {
    ctx.fillStyle = peak.color;
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      const stepW = peak.w * (1 - t);
      const stepH = peak.h / steps;
      ctx.fillRect(peak.x - stepW / 2, baseY - peak.h + i * stepH, stepW, stepH + 1);
    }
  }
}

function initStyleScoreAccumulator() {
  if (game.state === GameState.START || game.state === GameState.PAUSED || game.state === GameState.GAMEOVER || game.state === GameState.WON) return;
  
  if (!game.styleScore) {

  }
}

function updateStyleScoreOnProximity(dt) {
  if (player.state === PlayerState.CRASHED) return;
  const proximityThreshold = 30;
  for (const skier of game.npcSkiers) {
    const dx = player.x - skier.x;
    const dy = player.y - skier.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < proximityThreshold) {
      game.styleScore += 1;
    }
  }
}

function calculateStyledScore(basePoints) {
  return basePoints * game.styleMultiplier;
}

function applyStyleMultiplierToScore(points) {
  const awarded = calculateStyledScore(points);
const treeWidth = scaleTreeWidthByHeight(100, 0.05);

  game.styleScore += awarded;
  game.styleMultiplier *= 2;
  checkAndTriggerComboStreak(game.lastTime);
  return awarded;
}

// Chains consecutive style actions (slalom passes, etc.) into a "combo streak":
// each call is a timestamped style action, and if it lands within
// COMBO_STREAK_WINDOW_MS of the previous one the streak keeps growing; otherwise
// it resets to 1. Every COMBO_STREAK_THRESHOLD-length streak awards a style bonus
// and (the first time only) unlocks the comboStreak achievement.
const COMBO_STREAK_WINDOW_MS = 1200;
const COMBO_STREAK_THRESHOLD = 3;
const COMBO_STREAK_BONUS = 50;

function checkAndTriggerComboStreak(styleActionTime) {
  if (typeof game.comboStreak !== 'number') game.comboStreak = 0;
  if (typeof game.lastStyleActionTime !== 'number') game.lastStyleActionTime = 0;

  if (game.lastStyleActionTime && (styleActionTime - game.lastStyleActionTime) <= COMBO_STREAK_WINDOW_MS) {
    game.comboStreak += 1;
  } else {
    game.comboStreak = 1;
  }
  game.lastStyleActionTime = styleActionTime;

  if (game.comboStreak > 0 && game.comboStreak % COMBO_STREAK_THRESHOLD === 0) {
    game.styleScore = (game.styleScore || 0) + COMBO_STREAK_BONUS;
    game.trickText = `COMBO STREAK x${game.comboStreak}! +${COMBO_STREAK_BONUS}`;
    game.trickTime = 1;

    if (!Array.isArray(game.achievements)) game.achievements = [];
    let achievement = game.achievements.find(a => a.type === 'comboStreak');
    if (!achievement) {
      achievement = {
        type: 'comboStreak',
        title: 'Combo Streak',
        description: `Chain ${COMBO_STREAK_THRESHOLD} style actions in a row`,
        counter: 0,
        unlockThreshold: 1,
        unlocked: false
      };
      game.achievements.push(achievement);
    }
    if (!achievement.unlocked) {
      achievement.unlocked = true;
      showAchievementUnlock(achievement);
    }
  }
}

resetStyleScoreOnDeath();

getTreeWidthFromSeed(42);

spawnBadge(x, y, type);

function initStyleScoreSystem() {

// Awards style score for skiing close to an NPC, using a direct bounding-box overlap
// test on player/npc positions (same box math as checkNPCCollision) rather than
// delegating to checkNPCProximity(), which exists for the separate near-miss trick text
// system and must not be reused here.
function checkStyleScoreProximity(dt) {
  if (!Array.isArray(game.npcSkiers)) return;
  if (player.state === PlayerState.CRASHED || player.state === PlayerState.EATEN) return;
  const pb = {x:player.x-8, y:player.y-10, w:16, h:22};
  for (let i = 0; i < game.npcSkiers.length; i++) {
    const npc = game.npcSkiers[i];
    const nb = {x:npc.x-10, y:npc.y-18, w:20, h:34};
    if (overlaps(pb, nb)) {
      game.styleScore += 1;
    }
  }
}

// Awards one style-score point per NPC skier per pass: fires once when the player
// comes within 30px of an NPC without colliding, using a per-NPC `scoredPass` flag
// (mirrors the `grazed` flag in checkNPCProximity) so a single pass can't repeat the
// award every frame, and re-arms once the player drifts back out of range.
function checkStyleScoreOnPass(dt) {
  if (!Array.isArray(game.npcSkiers)) return;
  if (player.state === PlayerState.CRASHED || player.state === PlayerState.EATEN) return;
  const pb = {x:player.x-8, y:player.y-10, w:16, h:22};
  for (let i = 0; i < game.npcSkiers.length; i++) {
    const npc = game.npcSkiers[i];
    const dx = player.x - npc.x;
    const dy = player.y - npc.y;
    const distance = Math.sqrt(dx*dx + dy*dy);
    const nb = {x:npc.x-10, y:npc.y-18, w:20, h:34};
    if (distance < 30 && !overlaps(pb, nb)) {
      if (!npc.scoredPass) {
        npc.scoredPass = true;
        game.styleScore = (game.styleScore || 0) + 1;
      }
    } else {
      npc.scoredPass = false;
    }
  }
}

// Checks every NPC skier for a near-miss: within 30px of the player but not
// bounding-box colliding (collision is handled separately by checkNPCCollision).
function callStyleScoreCheckEveryFrame() {
  if (game.state !== GameState.PLAYING) return;
  if (!Array.isArray(game.npcSkiers)) return;
  if (player.state === PlayerState.CRASHED || player.state === PlayerState.EATEN) return;
  const pb = {x:player.x-8, y:player.y-10, w:16, h:22};
  for (let i = 0; i < game.npcSkiers.length; i++) {
    const npc = game.npcSkiers[i];
    const dx = player.x - npc.x;
    const dy = player.y - npc.y;
    const distance = Math.sqrt(dx*dx + dy*dy);
    const nb = {x:npc.x-10, y:npc.y-18, w:20, h:34};
    if (distance < 30 && !overlaps(pb, nb)) {
      game.styleScore += 1;
    }
  }
}

// Thresholds the style score can cross; each one unlocks exactly one achievement,
// the first time game.styleScore reaches it (not "divisible by 5", which would
// refire on every frame the score sits at a multiple of 5).
const STYLE_SCORE_ACHIEVEMENT_THRESHOLDS = [5, 10, 15, 20];

function registerStyleScoreAchievement() {
  if (!Array.isArray(game.styleScoreThresholdsCrossed)) game.styleScoreThresholdsCrossed = [];
  if (!Array.isArray(game.achievements)) game.achievements = [];
  const score = game.styleScore || 0;
  for (const threshold of STYLE_SCORE_ACHIEVEMENT_THRESHOLDS) {
    if (score < threshold) continue;
    if (game.styleScoreThresholdsCrossed.includes(threshold)) continue;
    game.styleScoreThresholdsCrossed.push(threshold);
    const title = `Style Score ${threshold}`;
    const description = `Reach a style score of ${threshold}`;
    const newAchievement = { type: `styleScore${threshold}`, title, description, counter: threshold, unlockThreshold: threshold, unlocked: true };
    game.achievements.push(newAchievement);
    showAchievementUnlock(newAchievement);
  }
}

// Tracks the player's best-ever style score (separate from the fixed-threshold
// achievements in registerStyleScoreAchievement) and unlocks a one-time
// "personal best" achievement once that record clears STYLE_SCORE_BEST_THRESHOLD.
const STYLE_SCORE_BEST_THRESHOLD = 25;

function checkStyleScoreAchievement() {
  if (!Array.isArray(game.achievements)) game.achievements = [];
  const score = game.styleScore || 0;
  if (typeof game.bestStyleScore !== 'number') game.bestStyleScore = 0;
  if (score > game.bestStyleScore) game.bestStyleScore = score;

  let achievement = game.achievements.find(a => a.type === 'styleScoreBest');
  if (!achievement) {
    achievement = { type: 'styleScoreBest', title: 'Style Icon', description: `Reach a style score of ${STYLE_SCORE_BEST_THRESHOLD}`, counter: 0, unlockThreshold: STYLE_SCORE_BEST_THRESHOLD, unlocked: false };
    game.achievements.push(achievement);
  }
  achievement.counter = game.bestStyleScore;
  if (!achievement.unlocked && game.bestStyleScore >= STYLE_SCORE_BEST_THRESHOLD) {
    achievement.unlocked = true;
    showAchievementUnlock(achievement);
  }
}

function checkSnowWolfCollision(dt) {
    if (game.state === GameState.GAMEOVER || game.state === GameState.WON) return;
    if (player.invulnerable > 0 || player.state === PlayerState.CRASHED || player.state === PlayerState.EATEN) return;

}

function drawLodgeEntrance() {
    const baseHeight = canvas.height / 3;
    const baseWidth = baseHeight * 1.5;
    const pillarWidth = baseHeight / 6;
    const doorWidth = baseHeight / 4;
    const doorHeight = baseHeight / 2;
    const roofSlope = baseHeight / 8;

    const centerX = canvas.width / 2;
    const centerY = canvas.height - baseHeight / 2;

    // Draw the rectangular base
    ctx.fillStyle = BIOME_TINTS[0]; // Assuming BIOME_TINTS is an array of colors
    ctx.fillRect(centerX - baseWidth / 2, centerY - baseHeight / 2, baseWidth, baseHeight);

    // Draw the two vertical pillars
    ctx.fillStyle = WARBOY_FRAMES[0].color; // Assuming WARBOY_FRAMES is an array of frames with color property
    ctx.fillRect(centerX - pillarWidth / 2, centerY - baseHeight / 2, pillarWidth, baseHeight);
    ctx.fillRect(centerX + baseWidth / 2 - pillarWidth / 2, centerY - baseHeight / 2, pillarWidth, baseHeight);

    // Draw the slanted roof
    ctx.beginPath();
    ctx.moveTo(centerX - baseWidth / 2, centerY - baseHeight / 2);
    ctx.lineTo(centerX, centerY - baseHeight / 2 - roofSlope);
    ctx.lineTo(centerX + baseWidth / 2, centerY - baseHeight / 2);
    ctx.closePath();
    ctx.fillStyle = WARBOY_FRAMES[1].color; // Assuming WARBOY_FRAMES has a second frame with color property
    ctx.fill();

    // Draw the door with a handle
    ctx.fillStyle = BIOME_TINTS[1]; // Assuming BIOME_TINTS has a second color
    ctx.fillRect(centerX - doorWidth / 2, centerY + baseHeight / 4, doorWidth, doorHeight);
    ctx.beginPath();
    ctx.arc(centerX - doorWidth / 4, centerY + baseHeight / 4 + doorHeight / 3, doorHeight / 10, 0, Math.PI * 2);
    ctx.fillStyle = WARBOY_FRAMES[2].color; // Assuming WARBOY_FRAMES has a third frame with color property
    ctx.fill();
}

function drawBranchingFoliage(treeX, treeY, treeHeight, treeWidth) {
  const greenTint = BIOME_TINTS[0];
  ctx.fillStyle = greenTint;

  // Topmost equilateral triangle (smallest)
  const topSize = treeWidth * 0.4;
  const topX = treeX + treeWidth / 2;
  const topY = treeY - treeHeight * 0.1;
  const topH = topSize * Math.sqrt(3) / 2;
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(topX - topSize / 2, topY + topH);
  ctx.lineTo(topX + topSize / 2, topY + topH);
  ctx.closePath();
  ctx.fill();

  // Middle equilateral triangle (medium)
  const midSize = treeWidth * 0.6;
  const midX = treeX + treeWidth / 2;
  const midY = treeY - treeHeight * 0.3;
  const midH = midSize * Math.sqrt(3) / 2;
  ctx.beginPath();
  ctx.moveTo(midX, midY);
  ctx.lineTo(midX - midSize / 2, midY + midH);
  ctx.lineTo(midX + midSize / 2, midY + midH);
  ctx.closePath();
  ctx.fill();

  // Bottom equilateral triangle (largest)
  const botSize = treeWidth * 0.8;
  const botX = treeX + treeWidth / 2;
  const botY = treeY - treeHeight * 0.5;
  const botH = botSize * Math.sqrt(3) / 2;
  ctx.beginPath();
  ctx.moveTo(botX, botY);
  ctx.lineTo(botX - botSize / 2, botY + botH);
  ctx.lineTo(botX + botSize / 2, botY + botH);
  ctx.closePath();
  ctx.fill();

  // Pine-like tips: two small circles
  const tipRadius = treeWidth * 0.08;
  ctx.beginPath();
  ctx.arc(topX, topY - topH * 0.3, tipRadius, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(topX, topY + topH * 0.3, tipRadius, 0, Math.PI * 2);
  ctx.fill();
}

// Called by every achievement path (checkAchievement, hazard achievements, style-score

// Sets up the shared AudioContext that every synthesized sound cue (crash
// thud, jump blip, etc.) plays through, and unlocks it on the player's first
// keypress/pointer press since browsers suspend audio until a user gesture.
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC && !game.audioCtx) {
    try { game.audioCtx = new AC(); } catch (e) { game.audioCtx = null; }
  }
  function unlockAudio() {
    if (game.audioCtx && game.audioCtx.state === 'suspended') {
      game.audioCtx.resume();
    }
  }
  addEventListener('keydown', unlockAudio, { passive: true });
  addEventListener('pointerdown', unlockAudio, { passive: true });
}

// Synthesizes Warboy's crash cue entirely with the Web Audio API (no audio
// assets): a distorted noise burst for the metallic impact plus a falling
// square-wave thud. AudioContext creation is deferred to first play so
// initCrashSound() itself never throws in environments without audio support.
function initCrashSound() {
  game.playCrashSound = function() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!game.audioCtx) game.audioCtx = new AC();
      const ctx = game.audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;

      const bufferSize = Math.floor(ctx.sampleRate * 0.3);
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const distortion = ctx.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / 128) - 1;
        curve[i] = Math.tanh(x * 8);
      }
      distortion.curve = curve;
      distortion.oversample = '2x';

      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = 900;
      bandpass.Q.value = 0.8;

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.5, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

      noise.connect(distortion);
      distortion.connect(bandpass);
      bandpass.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.3);

      const thud = ctx.createOscillator();
      thud.type = 'square';
      thud.frequency.setValueAtTime(160, now);
      thud.frequency.exponentialRampToValueAtTime(40, now + 0.2);
      const thudGain = ctx.createGain();
      thudGain.gain.setValueAtTime(0.4, now);
      thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      thud.connect(thudGain);
      thudGain.connect(ctx.destination);
      thud.start(now);
      thud.stop(now + 0.25);
    } catch (e) {}
  };
}

// Renders Warboy's crash cue to a reusable WAV-backed Audio object (mirroring
// the noise-burst-plus-falling-thud shape that initCrashSound() synthesizes
// live) so repeated crashes can play via cheap cloneNode() playback instead of
// rebuilding a Web Audio graph every time. Falls back to the live
// AudioContext version from initCrashSound() if the Audio object can't be
// created.
function synthesizeCrashWaveform(sampleRate, duration) {
  const totalSamples = Math.floor(sampleRate * duration);
  const samples = new Float32Array(totalSamples);
  for (let i = 0; i < totalSamples; i++) {
    const t = i / sampleRate;
    const noiseEnvelope = Math.exp(-t * 10);
    const noise = (Math.random() * 2 - 1) * noiseEnvelope * 0.5;
    const thudFreq = 160 * Math.exp(-t * 8) + 40;
    const thudEnvelope = Math.exp(-t * 12);
    const thud = Math.sin(2 * Math.PI * thudFreq * t) * thudEnvelope * 0.4;
    samples[i] = Math.max(-1, Math.min(1, noise + thud));
  }
  return samples;
}

function initCrashSoundEffect() {
  try {
    const sampleRate = 44100;
    const wavBytes = encodeWavFromSamples(synthesizeCrashWaveform(sampleRate, 0.3), sampleRate);
    let binary = '';
    for (let i = 0; i < wavBytes.length; i++) binary += String.fromCharCode(wavBytes[i]);
    game.crashSoundEffect = new Audio('data:audio/wav;base64,' + btoa(binary));
    game.crashSoundEffect.volume = 0.6;
  } catch (e) {
    game.crashSoundEffect = null;
  }
  const liveCrashSound = game.playCrashSound;
  game.playCrashSound = function() {
    try {
      if (game.crashSoundEffect) {
        const cue = game.crashSoundEffect.cloneNode ? game.crashSoundEffect.cloneNode(true) : game.crashSoundEffect;
        cue.currentTime = 0;
        const p = cue.play();
        if (p && typeof p.catch === 'function') p.catch(function() {});
        return;
      }
    } catch (e) {}
    if (typeof liveCrashSound === 'function') liveCrashSound();
  };
}

// Renders Warboy's jump cue — a quick high-pitched, bouncy double-blip —
// to a WAV byte buffer up front (synchronous math mirroring what an
// oscillator+gain envelope would produce) so `jumpSound` itself ends up a
// real, ready-to-play Audio object rather than a live audio-graph node.
function synthesizeJumpWaveform(sampleRate, duration) {
  const totalSamples = Math.floor(sampleRate * duration);
  const samples = new Float32Array(totalSamples);
  for (let i = 0; i < totalSamples; i++) {
    const t = i / sampleRate;
    const bounce = Math.abs(Math.sin(t * Math.PI * 9));
    const freq = 700 + bounce * 500;
    const envelope = Math.exp(-t * 9);
    samples[i] = Math.sin(2 * Math.PI * freq * t) * envelope * 0.6;
  }
  return samples;
}

function encodeWavFromSamples(samples, sampleRate) {
  const bytesPerSample = 2;
  const dataSize = samples.length * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const writeString = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * bytesPerSample, true);
  view.setUint16(32, bytesPerSample, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    offset += 2;
  }
  return new Uint8Array(buffer);
}

// Builds the ready-to-play jump cue Audio object from the synthesized
// waveform. Split out from initJumpSound() so the asset-creation step can be
// reused/retried independently of wiring up game.playJumpSound.
function loadJumpSoundEffect() {
  try {
    const sampleRate = 44100;
    const wavBytes = encodeWavFromSamples(synthesizeJumpWaveform(sampleRate, 0.22), sampleRate);
    let binary = '';
    for (let i = 0; i < wavBytes.length; i++) binary += String.fromCharCode(wavBytes[i]);
    const audio = new Audio('data:audio/wav;base64,' + btoa(binary));
    audio.volume = 0.5;
    return audio;
  } catch (e) {
    return null;
  }
}

function initJumpSound() {
  game.jumpSound = loadJumpSoundEffect();
  game.playJumpSound = function() {
    try {
      if (!game.jumpSound) return;
      const cue = game.jumpSound.cloneNode ? game.jumpSound.cloneNode(true) : game.jumpSound;
      cue.currentTime = 0;
      const p = cue.play();
      if (p && typeof p.catch === 'function') p.catch(function() {});
    } catch (e) {}
  };
}

function checkAchievementsOnFrame() {

// Foundation: a registry of hazard-triggered achievements, keyed by hazardType.
// Mirrors an entry into game.achievements so the existing trophy HUD (updateAchievementTrophies)
// renders it once unlocked, without duplicating that render logic here.
function registerHazardAchievement(hazardType, title, description, condition) {
  if (!game.achievementsRegistry) game.achievementsRegistry = {};
  if (game.achievementsRegistry[hazardType]) return game.achievementsRegistry[hazardType];
  const entry = { hazardType, title, description, condition, unlocked: false };
  game.achievementsRegistry[hazardType] = entry;
  if (!Array.isArray(game.achievements)) game.achievements = [];
  if (!game.achievements.some(a => a.type === hazardType)) {
    game.achievements.push({ type: hazardType, title, description, counter: 0, unlockThreshold: 1, unlocked: false });
  }
  return entry;
}

function checkHazardAchievements() {
  if (!game.achievementsRegistry) return;
  for (const hazardType in game.achievementsRegistry) {
    const entry = game.achievementsRegistry[hazardType];
    if (entry.unlocked) continue;
    if (typeof entry.condition === 'function' && entry.condition(game)) {
      entry.unlocked = true;
      const achievement = game.achievements.find(a => a.type === hazardType);
      if (achievement) achievement.unlocked = true;
      showAchievementUnlock(entry);
    }
  }
}

// Called from handleCollisions() every time the player actually runs into a hazard
// (as opposed to clearing/tricking one). Auto-registers a generic encounter-count
// achievement for hazardType the first time it's seen, keyed separately from any
// achievement registerHazardAchievement() set up by name (e.g. 'oilSlick' vs the raw
// obstacle type 'oil'), then re-evaluates the registry so it can unlock this frame.
const HAZARD_ENCOUNTER_THRESHOLD = 10;

function updateAchievementsOnHazardEncounter(hazardType) {
  if (!game.hazardEncounters) game.hazardEncounters = {};
  game.hazardEncounters[hazardType] = (game.hazardEncounters[hazardType] || 0) + 1;
  if (!game.achievementsRegistry || !game.achievementsRegistry[hazardType]) {
    registerHazardAchievement(
      hazardType,
      `Hazard Veteran: ${hazardType}`,
      `Encounter the ${hazardType} hazard ${HAZARD_ENCOUNTER_THRESHOLD} times.`,
      g => (g.hazardEncounters[hazardType] || 0) >= HAZARD_ENCOUNTER_THRESHOLD
    );
  }
  checkHazardAchievements();
}

function checkAchievement(actionKey, actionValue) {
  if (!Array.isArray(game.achievements)) return;
  const achievement = game.achievements.find(a => a.type === actionKey);
  if (!achievement || achievement.unlocked) return;
  achievement.counter += actionValue;
  if (achievement.counter >= achievement.unlockThreshold) {
    achievement.unlocked = true;
    showAchievementUnlock(achievement);
  }
}

// Generic proximity tracker: call once per frame per nearby entity (an NPC skier, the
// yeti, etc.) to build toward a "got close N times" achievement keyed by entityType.
// Reuses the same achievements array/unlock flow as checkAchievement()/showAchievementUnlock(),
// but owns its own threshold/range since NEAR_MISS_MARGIN and proximityThreshold in the
// near-miss/style-score helpers are locals scoped to those functions, not shared state.
const PROXIMITY_ACHIEVEMENT_RANGE = 40;
const PROXIMITY_ACHIEVEMENT_THRESHOLD = 10;

function trackAchievementOnProximity(entityType, entity) {
  if (!entity) return;
  if (!Array.isArray(game.achievements)) game.achievements = [];
  const dx = player.x - entity.x;
  const dy = player.y - entity.y;
  const distance = Math.hypot(dx, dy);
  if (distance > PROXIMITY_ACHIEVEMENT_RANGE) return;
  const achievementType = `proximity_${entityType}`;
  let achievement = game.achievements.find(a => a.type === achievementType);
  if (!achievement) {
    achievement = {
      type: achievementType,
      title: `Close Call: ${entityType}`,
      description: `Get within range of a ${entityType} ${PROXIMITY_ACHIEVEMENT_THRESHOLD} times`,
      counter: 0,
      unlockThreshold: PROXIMITY_ACHIEVEMENT_THRESHOLD,
      unlocked: false
    };
    game.achievements.push(achievement);
  }
  if (achievement.unlocked) return;
  achievement.counter++;
  if (achievement.counter >= achievement.unlockThreshold) {
    achievement.unlocked = true;
    showAchievementUnlock(achievement);
  }
}

// Generic progress tracker keyed by an arbitrary achievementKey. Unlike checkAchievement()
// (which requires the achievement to already exist in game.achievements), this auto-registers
// a sensible entry the first time it sees a new key, so callers don't need a separate
// registration step before they can start accumulating progress toward it.
const ACHIEVEMENT_DEFINITIONS = {
  nearMiss: { title: 'Near Miss Master', description: 'Graze past other skiers 15 times without crashing.', unlockThreshold: 15 }
};

function trackAchievement(achievementKey, value) {
  if (!Array.isArray(game.achievements)) game.achievements = [];
  let achievement = game.achievements.find(a => a.type === achievementKey);
  if (!achievement) {
    const def = ACHIEVEMENT_DEFINITIONS[achievementKey] || {
      title: achievementKey,
      description: `Reach the ${achievementKey} milestone.`,
      unlockThreshold: 1
    };
    achievement = {
      type: achievementKey,
      title: def.title,
      description: def.description,
      counter: 0,
      unlockThreshold: def.unlockThreshold,
      unlocked: false
    };
    game.achievements.push(achievement);
  }
  if (achievement.unlocked) return;
  achievement.counter += value;
  if (achievement.counter >= achievement.unlockThreshold) {
    achievement.unlocked = true;
    showAchievementUnlock(achievement);
  }
}

function updateAchievementTrophies() {
  ctx.font = '700 12px "Courier New", monospace';

}
