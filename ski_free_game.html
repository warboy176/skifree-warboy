<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Free Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
        }
        #game {
            border: 2px solid #000;
            background-color: #b7e4f4;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 20px;
            color: #000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="600" height="600"></canvas>
        <div id="status"></div>
    </div>
    <script src="ski_free_game.js"></script>
</body>
</html>
