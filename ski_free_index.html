<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Free</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
        }
        
        #gameCanvas {
            border: 2px solid #000;
            background-color: #87CEEB;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
        }
        
        #gameOverScreen {
            display: none;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        
        #scoreDisplay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        
        #highScoreDisplay {
            position: absolute;
            top: 40px;
            left: 10px;
            color: yellow;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="scoreDisplay">Score: 0</div>
        <div id="highScoreDisplay">High Score: 0</div>
        
        <div id="startScreen">
            <h1>Ski Free</h1>
            <p>Use arrow keys or mouse to move</p>
            <button onclick="startGame()">Start Game</button>
            <p>Demo mode: <a href="?demo=1">Enable</a></p>
        </div>
        
        <div id="gameOverScreen">
            <h1>Game Over</h1>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>
    
    <script src="ski_free_npc.js"></script>
    
    <script>
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            game.state = GameState.INTRO;
            // Start the game after a short delay
            setTimeout(() => {
                game.state = GameState.PLAYING;
            }, 1000);
        }
        
        function restartGame() {
            // Reset game state
            game.state = GameState.START;
            game.player = null;
            game.npcSkiers = [];
            game.score = 0;
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }
        
        function showIntro() {
            // Draw intro screen elements
        }
        
        function handleIntroInput() {
            // Handle any intro input if needed
        }
        
        // Update score display
        function updateScoreDisplay() {
            document.getElementById('scoreDisplay').textContent = 'Score: ' + game.score;
            document.getElementById('highScoreDisplay').textContent = 'High Score: ' + game.highScore;
        }
        
        // Game loop update for score display
        const originalGameLoop = gameLoop;
        
        function gameLoop(timestamp) {
            // Call the original game loop
            originalGameLoop(timestamp);
            
            // Update score display
            updateScoreDisplay();
        }
    </script>
</body>
</html>
